name: Release Mirrors

# The release workflow: on a v* tag it is the only place a release is published.
#
#   split              split each framework/SDK subtree into its read-only mirror
#                      repo and copy the tag onto it. Consumers point Composer VCS
#                      / Go modules at the mirrors (no Packagist). The push token
#                      is pulled from Infisical at runtime (Universal Auth,
#                      matching custd/cb) and passed via http.extraheader so it
#                      never lands in argv/process list or logs.
#   publish-verdaccio  the private registry the TrackLab web GUI installs from.
#   publish-packagist  the Packagist notify, when its secrets are configured.
#
# Publishing lived in ci.yml behind `needs:` on the test jobs. That meant one
# failing runner could withhold a release that had already been tagged and
# verified: v2.4.0 reached the mirrors and production but never Verdaccio. The
# guard is now a job of its own, and the three artifacts depend only on it, so a
# failure in one can no longer withhold the others.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Its own job so every artifact depends on the checks without depending on each
  # other: the guard failing is a real release defect, a sibling artifact failing
  # is not.
  release-guard:
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag must equal the VERSION source of truth
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match VERSION ($version)." >&2
            echo "One tag drives one version — bump VERSION and every package manifest together." >&2
            exit 1
          fi
          echo "Release tag v$tag matches VERSION."
      - name: SDK identity constants must match VERSION
        run: bash scripts/check-sdk-version-identity.sh

  split:
    needs: [release-guard]
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: laravel-package
            mirror: haakco/custd-sdk-laravel
          - prefix: wordpress-plugin
            mirror: haakco/custd-sdk-wordpress
          - prefix: sdk-go
            mirror: haakco/custd-sdk-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Don't persist the checkout token as an http.extraheader — our push
          # sets its own extraheader, and two would send a duplicate
          # Authorization header (git push → HTTP 400). The repo is public, so
          # the initial fetch needs no persisted credential.
          persist-credentials: false
      - name: Install Infisical CLI
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" install infisical@0.43.84
      - name: Split subtree and push to mirror
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          PREFIX: ${{ matrix.prefix }}
          MIRROR: ${{ matrix.mirror }}
          TAG: ${{ github.ref_name }}
        run: |
          domain="https://secrets.k8.haak.co/api"
          infisical() { "$HOME/.local/bin/mise" exec infisical@0.43.84 -- infisical "$@"; }
          token="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$domain" --plain --silent)"
          push_token="$(infisical secrets get MIRROR_PUSH_TOKEN \
            --token="$token" --projectId=952c94fb-3c39-4384-8087-2e459812bc3d \
            --env=prod --path=/custd-sdk --domain="$domain" --plain --silent)"

          split_sha="$(git subtree split --prefix="$PREFIX" | tr -d '[:space:]')"

          # The Go module's tests read shared contract fixtures that live at the
          # monorepo root, outside the sdk-go prefix. Vendor them into the split
          # (pure plumbing — no working-tree mutation) so the standalone
          # custd-sdk-go module is self-contained.
          if [ "$PREFIX" = "sdk-go" ]; then
            tmp_index="$(mktemp)"
            GIT_INDEX_FILE="$tmp_index" git read-tree "$split_sha"
            for f in $(git ls-files contract-fixtures); do
              blob="$(git hash-object -w "$f")"
              GIT_INDEX_FILE="$tmp_index" git update-index --add --cacheinfo "100644,$blob,$f"
            done
            new_tree="$(GIT_INDEX_FILE="$tmp_index" git write-tree)"
            # Pin the commit's dates to the split commit's date so the injection is
            # byte-for-byte reproducible: same source tag -> same commit SHA. Without
            # this, commit-tree stamps "now" and every run yields a new SHA, so the
            # (immutable) Go module tag push is rejected on re-runs.
            src_date="$(git show -s --format=%cI "$split_sha")"
            split_sha="$(GIT_AUTHOR_NAME=custd-sdk-ci GIT_AUTHOR_EMAIL=ci@haak.co \
              GIT_COMMITTER_NAME=custd-sdk-ci GIT_COMMITTER_EMAIL=ci@haak.co \
              GIT_AUTHOR_DATE="$src_date" GIT_COMMITTER_DATE="$src_date" \
              git commit-tree "$new_tree" -p "$split_sha" \
              -m 'chore: vendor contract-fixtures for standalone module')"
            rm -f "$tmp_index"
          fi

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$push_token" | base64 | tr -d '\n')"
          mirror_url="https://github.com/${MIRROR}.git"
          GIT_AUTH_HEADER="$auth_header" scripts/publish-release-mirror.sh \
            "$mirror_url" "$split_sha" "$TAG" "$PREFIX"

  publish-verdaccio:
    needs: [release-guard]
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install Infisical CLI
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" install infisical@0.43.84
      - name: Install JS dependencies
        run: pnpm -C sdk-js install --frozen-lockfile
      - name: Build JS SDK
        run: pnpm -C sdk-js run build
      - name: Build React SDK
        run: pnpm -C sdk-react run build
      # Auth is written to a temporary npm user config so GitHub installs from
      # `path:/sdk-js` and `path:/sdk-react` never inherit Verdaccio registry
      # settings. The token is
      # pulled from Infisical at runtime (Universal Auth, matching custd/cb).
      - name: Publish JS SDK to Verdaccio
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          # pnpm 10's publish delegates to npm with incompatible args (EUSAGE on
          # npm 11); publish with npm directly using a temporary user config.
          domain="https://secrets.k8.haak.co/api"
          infisical() { "$HOME/.local/bin/mise" exec infisical@0.43.84 -- infisical "$@"; }
          INFISICAL_TOKEN="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$domain" --plain --silent)"
          VERDACCIO_TOKEN="$(infisical secrets get VERDACCIO_TOKEN \
            --token="$INFISICAL_TOKEN" --projectId=952c94fb-3c39-4384-8087-2e459812bc3d \
            --env=prod --path=/custd-sdk --domain="$domain" --plain --silent)"
          npm_config="$(mktemp)"
          trap 'rm -f "$npm_config"' EXIT
          chmod 600 "$npm_config"
          printf '//verdaccio.k8.haak.co/:_auth=%s\n' "$VERDACCIO_TOKEN" > "$npm_config"
          export NPM_CONFIG_USERCONFIG="$npm_config"
          cd sdk-js && npm publish --registry=https://verdaccio.k8.haak.co/ --access restricted --ignore-scripts
          cd ../sdk-react && npm publish --registry=https://verdaccio.k8.haak.co/ --access restricted --ignore-scripts

  publish-packagist:
    needs: [release-guard]
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist secrets are not configured; skipping."
            exit 0
          fi
          curl -fsS --config - <<EOF
          request = "POST"
          header = "Content-Type: application/json"
          header = "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}"
          url = "https://packagist.org/api/update-package"
          data = "{\"repository\":{\"url\":\"https://github.com/haakco/custd-sdk\"}}"
          EOF
