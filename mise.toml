[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "latest"
python = "3.15.2"
uv = "latest"
php = "8.5.12"
just = "latest"
actionlint = "latest"
ripgrep = "latest"
# Declared because the release-mirror job resolves it as `mise which infisical`
# before invoking it by path. Undeclared, mise installs the bin but reports
# "infisical is a mise bin however it is not currently active" and the job fails
# before it can read its push token.
infisical = "latest"

# Static analysis — pinned because their output gates CI (a version bump can
# change findings). Biome is intentionally absent: it is pinned via sdk-js's
# package.json + pnpm-lock.yaml, the JS-native version source.
#
# 2.14.0 is a floor, not a preference: it links golang.org/x/tools v0.50.0,
# which understands Go 1.27 export data. 2.13.2 links v0.49.0, which stops one
# version short and fails on untouched files with "export data version 5 is
# greater than maximum supported version 4" once this repo's Go is 1.27.2. Keep
# this in step with the go pin above and with the CI install step.
golangci-lint = "2.15.0"
ruff = "0.17.3"
"pipx:mypy" = { version = "2.4.0", uvx = "true" }
shellcheck = "latest"
rumdl = "latest"

[plugins]
php = "https://github.com/haakco/mise-php#096907cce61149ccb0dc6a061a3efcd8d1ee9d14"

[vars]
# Native PowerShell does not export HOME.
user_home = "{% if os() == 'windows' %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}"

[env]
GOPATH = "{{ vars.user_home }}/.go"
GOCACHE = "{{ vars.user_home }}/.cache/go-build"
GOMODCACHE = "{{ vars.user_home }}/go/pkg/mod"
_.path = ["{{ env.GOPATH }}/bin"]
# Static project configuration only; secret commands use the isolated
# Docker profile: just infisical-login / just infisical-status.
_.file = [".env"]

[tasks.test]
description = "Run all SDK tests"
run = "just test"

[tasks.test-go]
description = "Run Go SDK tests"
run = "just test-go"

[tasks.test-js]
description = "Run TypeScript SDK tests and build"
run = "just test-js"

[tasks.test-python]
description = "Run Python SDK tests"
run = "just test-python"

[tasks.test-php]
description = "Run PHP SDK tests"
run = "just test-php"

[tasks.lint-workflows]
description = "Lint GitHub Actions workflows"
run = "actionlint"

